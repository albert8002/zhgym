# Prüft die Aufgaben-Generatoren und baut alle Pakete auf Windows, macOS und Linux.
# Ein Tag v* (z. B. v1.3.1) erstellt zusätzlich einen Release-Entwurf mit allen Dateien.
name: Bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            name: windows
          - os: macos-latest
            script: dist:mac
            name: macos-arm64
          - os: ubuntu-latest
            script: dist:linux
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Werkzeuge für das pacman-Paket
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools zstd
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/Gymi-Trainer-ZH-*-Setup.exe
            dist/Gymi-Trainer-ZH-*-portable.exe
            dist/Gymi-Trainer-ZH-*-mac-arm64.zip
            dist/Gymi-Trainer-ZH-*-mac-arm64.dmg
            dist/gymi-trainer-zh-*-x86_64.pkg.tar.zst
            dist/Gymi-Trainer-ZH-*-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Prüfsummen
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release-Entwurf
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" --draft \
            --title "Gymi-Trainer ZH ${GITHUB_REF_NAME#v}" \
            --notes "Installation und erster Start: siehe README. Die Programme sind nicht von Microsoft oder Apple beglaubigt; beim ersten Start fragt das System nach."
