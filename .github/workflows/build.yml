# Prüft die Aufgaben-Generatoren und baut alle Pakete auf Windows, macOS und Linux.
# Ein Tag v* (z. B. v1.4.1) erstellt zusätzlich einen Release-Entwurf mit allen Dateien.
name: Bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            name: windows
          - os: macos-latest
            script: dist:mac
            name: macos-arm64
          - os: ubuntu-latest
            script: dist:linux
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Werkzeuge für das pacman-Paket
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools zstd xvfb
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Starttest: die gebaute App öffnen, warten bis die erste Seite gezeichnet ist, wieder schliessen
      - name: Starttest (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a env GYMI_SMOKE=1 dist/linux-unpacked/gymi-trainer-zh --no-sandbox
      - name: Starttest (macOS, aus dem ZIP)
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: |
          rm -rf "$RUNNER_TEMP/zip" && mkdir "$RUNNER_TEMP/zip"
          unzip -q dist/Gymi-Trainer-ZH-*-mac-arm64.zip -d "$RUNNER_TEMP/zip"
          codesign --verify --deep --strict "$RUNNER_TEMP/zip/Gymi-Trainer ZH.app"
          GYMI_SMOKE=1 "$RUNNER_TEMP/zip/Gymi-Trainer ZH.app/Contents/MacOS/Gymi-Trainer ZH"
      - name: Starttest (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:GYMI_SMOKE = '1'
          $p = Start-Process -FilePath 'dist\win-unpacked\Gymi-Trainer ZH.exe' -Wait -PassThru -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke-out.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Get-Content smoke-err.txt -ErrorAction SilentlyContinue; throw "Starttest fehlgeschlagen (Exit-Code $($p.ExitCode))" }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/Gymi-Trainer-ZH-*-Setup.exe
            dist/Gymi-Trainer-ZH-*-portable.exe
            dist/Gymi-Trainer-ZH-*-mac-arm64.zip
            dist/Gymi-Trainer-ZH-*-mac-arm64.dmg
            dist/gymi-trainer-zh-*-x86_64.pkg.tar.zst
            dist/Gymi-Trainer-ZH-*-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Prüfsummen
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release-Entwurf
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" --draft \
            --title "Gymi-Trainer ZH ${GITHUB_REF_NAME#v}" \
            --notes "Installation und erster Start: siehe README. Die Programme sind nicht von Microsoft oder Apple beglaubigt; beim ersten Start fragt das System nach."
