# Prüft die Aufgaben-Generatoren und baut alle Pakete auf Windows, macOS und Linux.
# Nach einem Push auf main entsteht ein Release-Entwurf für die Version in package.json (siehe Job «release»).
name: Bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            name: windows
          - os: macos-latest
            script: dist:mac
            name: macos-arm64
          - os: ubuntu-latest
            script: dist:linux
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Werkzeuge für das pacman-Paket
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools zstd xvfb
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Starttest: die gebaute App öffnen, warten bis die erste Seite gezeichnet ist, wieder schliessen
      - name: Starttest (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a env GYMI_SMOKE=1 dist/linux-unpacked/gymi-trainer-zh --no-sandbox
      - name: Starttest (macOS, aus dem ZIP)
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: |
          rm -rf "$RUNNER_TEMP/zip" && mkdir "$RUNNER_TEMP/zip"
          unzip -q dist/Gymi-Trainer-ZH-*-mac-arm64.zip -d "$RUNNER_TEMP/zip"
          codesign --verify --deep --strict "$RUNNER_TEMP/zip/Gymi-Trainer ZH.app"
          GYMI_SMOKE=1 "$RUNNER_TEMP/zip/Gymi-Trainer ZH.app/Contents/MacOS/Gymi-Trainer ZH"
      - name: Starttest (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:GYMI_SMOKE = '1'
          $p = Start-Process -FilePath 'dist\win-unpacked\Gymi-Trainer ZH.exe' -Wait -PassThru -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke-out.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Get-Content smoke-err.txt -ErrorAction SilentlyContinue; throw "Starttest fehlgeschlagen (Exit-Code $($p.ExitCode))" }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/Gymi-Trainer-ZH-*-Setup.exe
            dist/Gymi-Trainer-ZH-*-portable.exe
            dist/Gymi-Trainer-ZH-*-mac-arm64.zip
            dist/Gymi-Trainer-ZH-*-mac-arm64.dmg
            dist/gymi-trainer-zh-*-x86_64.pkg.tar.zst
            dist/Gymi-Trainer-ZH-*-x86_64.AppImage

  # Release-Entwurf für die Version in package.json (nur nach einem Push auf main oder einem Tag v*).
  # Ist die Version schon veröffentlicht, passiert nichts. Ein älterer Entwurf derselben Version wird ersetzt.
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Release-Entwurf erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version"); TAG="v$VER"; R="$GITHUB_REPOSITORY"
          if gh api "repos/$R/releases?per_page=100" --jq ".[] | select(.tag_name==\"$TAG\" and (.draft|not)) | .id" | grep -q .; then
            echo "$TAG ist schon veröffentlicht. Für einen neuen Release die Version in package.json erhöhen."; exit 0
          fi
          for id in $(gh api "repos/$R/releases?per_page=100" --jq ".[] | select(.tag_name==\"$TAG\" and .draft) | .id"); do gh api -X DELETE "repos/$R/releases/$id"; done
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          awk -v h="## Neu in $VER" '$0==h{f=1;next} /^## /{f=0} f' README.md > notes.md
          printf '\nInstallation und erster Start: siehe [README](https://github.com/%s#installieren). Die Programme sind nicht von Microsoft oder Apple beglaubigt; beim ersten Start fragt das System nach.\n' "$R" >> notes.md
          gh release create "$TAG" out/* --repo "$R" --draft --target "$GITHUB_SHA" --title "Gymi-Trainer ZH $VER" --notes-file notes.md
